[project]
name = "multi-agent-dev-team"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".specify", "specs", "workspace", ".chroma"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "smoke: calls the real Anthropic API (skipped when ANTHROPIC_API_KEY is not set)",
]
